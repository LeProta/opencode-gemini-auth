name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Windows is the only supported platform. This runner is Windows Server 2025, not
    # Windows 11: GitHub has no x64 Windows 11 runner. Windows 11 is checked locally.
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell # Windows PowerShell 5.1, the shell Windows 11 ships
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the runtime OpenCode embeds
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.13.0 # for smoke:node-import
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run bundle
      - name: dist/ matches the sources (OpenCode installs it as committed)
        run: git diff --exit-code -- dist
      - run: bun run smoke:node-import
